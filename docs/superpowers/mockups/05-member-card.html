<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background border-b border-outline-variant dark:border-outline flex items-center justify-between px-md h-16 w-full max-w-7xl mx-auto sticky top-0 z-40">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed cursor-pointer active:opacity-80" data-icon="menu">menu</span>
<span class="font-app-name text-app-name text-primary dark:text-primary-fixed tracking-tight">POLKS GROUP</span>
</div>
<div>
<span class="font-page-title text-page-title text-on-surface">Member Card</span>
</div>
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-lg flex flex-col items-center">
<!-- Digital Card -->
<div class="w-full bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-sm flex flex-col items-center mb-lg relative overflow-hidden">
<!-- Decorative accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<div class="w-full flex justify-between items-start mb-xl">
<div>
<h2 class="font-card-title text-card-title text-on-surface">Sandria</h2>
<p class="font-caption text-caption text-outline">Regular Member</p>
</div>
<div class="text-right">
<span class="font-card-title text-card-title text-primary">1,250</span>
<span class="font-caption text-caption text-outline ml-1">pts</span>
</div>
</div>
<!-- QR Code Area -->
<div class="w-full max-w-[240px] aspect-square bg-surface border-2 border-dashed border-outline-variant rounded-lg flex items-center justify-center mb-md relative overflow-hidden">
<img alt="QR Code" class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="A clean, high-contrast, perfectly square digital QR code graphic centered on a bright white background. The pattern is crisp black and white, designed to look highly scannable and functional. Soft, diffused lighting creates a clinical, modern fintech aesthetic. Minimalist presentation with no distracting elements, emphasizing utility and precision." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGGLxN7mJtX7dkApHwwLtdS4dLVJSlwKXUJxfuqdmJ475vNdhfMu6eisu7MrWsnQE9urI3dsMWOXcyJaChOmuLCkTBylJ6SFj7TpXyb94NbwBYbLJUzM4ikAeyiz64c-VZbDMbhOVUupAXRb0pPDELcqaTF5Aee7G7FIoPFBx3XxJFl54OL4m14EkshHA0vWHGOQ3SVdYjO9KN9yLo42vubyancq7mmGQ4xIYIlTxNqNC8sLicUXIggdJJ1ML61tGA4Tl0stjqHFw"/>
<!-- Overlay scan line effect -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/50 blur-sm animate-[scan_2s_ease-in-out_infinite]"></div>
</div>
<p class="font-body-semibold text-body-semibold text-on-surface-variant mb-xl text-center">Show this QR to cashier</p>
<div class="text-center">
<p class="font-caption text-caption text-outline mb-1">Card Number</p>
<p class="font-body text-body text-on-surface tracking-widest">**** **** **** 4829</p>
</div>
</div>
<!-- Actions -->
<div class="w-full flex gap-md">
<button class="flex-1 bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface font-body-semibold text-body-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 border border-outline-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                Refresh QR
            </button>
<button class="flex-1 bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface font-body-semibold text-body-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 border border-outline-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="history">history</span>
                History
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-on-secondary-fixed dark:bg-on-background shadow-lg fixed bottom-base left-1/2 -translate-x-1/2 w-[320px] rounded-full z-50 flex justify-around items-center px-4 py-2 md:hidden">
<a class="flex flex-col items-center justify-center text-secondary-fixed-dim p-2 hover:text-primary-fixed transition-all scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-xs text-label-xs">Home</span>
</a>

<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-xs text-label-xs">Profile</span>
</a>
</nav>
